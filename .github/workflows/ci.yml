name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.94.0 fmt -- --check
      - run: cargo +1.94.0 clippy --release -- -D warnings
      - run: cargo +1.94.0 build --release
      - run: |
          ! readelf -l target/x86_64-unknown-linux-gnu/release/vibe-sh | grep -q INTERP
          ! readelf -d target/x86_64-unknown-linux-gnu/release/vibe-sh | grep -q NEEDED
          target/x86_64-unknown-linux-gnu/release/vibe-sh -c 'cd /'
          target/x86_64-unknown-linux-gnu/release/vibe-sh -c help | grep -F 'builtins: help clear echo cd uname pid reboot exit'
          test "$(target/x86_64-unknown-linux-gnu/release/vibe-sh -c clear)" = "$(printf '\033[2J\033[H')"
          output=$(mktemp)
          target/x86_64-unknown-linux-gnu/release/vibe-sh -c "echo redirected > $output"
          test "$(cat "$output")" = "redirected"
          rm "$output"
