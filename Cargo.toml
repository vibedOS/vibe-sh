[package]
name = "vibe-sh"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "The vibeOS interactive shell"
repository = "https://github.com/vibedOS/vibe-sh"

[dependencies]
vibe-rt = { git = "https://github.com/vibedOS/vibe-rt", rev = "7bac5094776ffe718e76e32cd17eea54b36141f3" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "symbols"
